name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: sync
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/registry-sync:${{ github.ref_name }}

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
      - run: make build
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes contracts/starknet/target/release/registry_Registry.{contract_class,compiled_contract_class}.json
        env:
          GH_TOKEN: ${{ github.token }}
